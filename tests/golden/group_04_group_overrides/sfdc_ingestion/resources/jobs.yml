resources:
  jobs:
    job_finance_p01:
      name: finance_p01
      schedule:
        quartz_cron_expression: 0 */15 * * * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
      - task_key: run_pipeline
        pipeline_task:
          pipeline_id: ${resources.pipelines.pipeline_finance_p01.id}
    job_hr_p01:
      name: hr_p01
      schedule:
        quartz_cron_expression: 0 */15 * * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
      - task_key: run_pipeline
        pipeline_task:
          pipeline_id: ${resources.pipelines.pipeline_hr_p01.id}
    job_sales_p01:
      name: sales_p01
      schedule:
        quartz_cron_expression: 0 */15 * * * ?
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
      - task_key: run_pipeline
        pipeline_task:
          pipeline_id: ${resources.pipelines.pipeline_sales_p01.id}
